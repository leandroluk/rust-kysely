<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>rust-kysely — Type-Safe SQL Query Builder in Pure Rust</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description"
    content="Macro-free, lightweight, pure Rust SQL query builder and runner faithfully ported from Kysely (TypeScript).">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Docsify Themeable style (Simple theme) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">

  <!-- Code highlight theme (Prism Tomorrow) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.min.css">

  <style>
    :root {
      /* Deep Emerald & Cyan palette matching database / SQL aesthetics */
      --theme-color: #059669;
      --theme-color-hover: #047857;
      --theme-color-active: #065f46;
      --base-font-size: 16px;
      --heading-color: #0f172a;
      --strong-color: #1e293b;
      --sidebar-background: #f8fafc;
      --sidebar-width: 290px;
      --content-max-width: 920px;
      --code-theme-background: #1e1e2e;
      --code-inline-background: #f1f5f9;
      --code-inline-color: #059669;
      --code-inline-border-radius: 4px;
    }

    body {
      font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .markdown-section pre {
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      border: 1px solid #2d3748;
      margin: 1.5em 0;
      background-color: #1e1e2e !important;
    }

    .markdown-section pre code {
      color: #f8f8f2 !important;
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, Monaco, monospace !important;
    }

    .sidebar {
      border-right: 1px solid #e2e8f0;
    }

    .sidebar-nav li a {
      font-weight: 500;
      color: #475569;
      transition: color 0.2s ease;
    }

    .sidebar-nav li a:hover {
      color: var(--theme-color-hover);
    }

    .sidebar-nav li.active>a {
      color: var(--theme-color);
      font-weight: 600;
      border-right: 2px solid var(--theme-color);
    }

    a {
      color: var(--theme-color);
    }

    a:hover {
      color: var(--theme-color-hover);
    }

    .badge-pill {
      display: inline-block;
      padding: 0.25em 0.6em;
      font-size: 80%;
      font-weight: 600;
      border-radius: 9999px;
      background-color: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
    }
  </style>
</head>

<body>
  <div id="app">Loading documentation...</div>
  <script>
    window.$docsify = {
      name: 'rust-kysely',
      repo: 'https://github.com/leandroluk/rust-kysely',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No results found!',
        depth: 6
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!'
      }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- Syntax highlighting (Prism) -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-rust.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-toml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>

</html>
