[package]
name = "rust-kysely"
version = "0.1.0"
edition = "2021"
authors = ["Leandro Luk <leandroluk@users.noreply.github.com>"]
description = "Pure Rust, type-safe SQL query builder and runner ported from Kysely (TypeScript) without macros."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/leandroluk/rust-kysely"
keywords = ["kysely", "sql", "query-builder", "postgres", "database"]
categories = ["database", "asynchronous"]
rust-version = "1.85"

[features]
default = ["std", "postgres"]
std = []
postgres = ["dep:tokio-postgres", "dep:tokio"]
mysql = []
sqlite = []
mssql = []
pglite = ["postgres"]
json = ["dep:serde_json", "dep:serde"]

[dependencies]
compact_str = { version = "0.10.0", default-features = false }
smallvec = { version = "1.16.4", default-features = false }
async-trait = "0.1"
thiserror = "2.0"
tokio = { version = "1.0", features = ["sync", "rt"], optional = true }
tokio-postgres = { version = "0.7", optional = true }
serde = { version = "1.0", default-features = false, optional = true }
serde_json = { version = "1.0", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }

[[test]]
name = "integration"
path = "tests/integration.rs"

# Footprint control: strictly avoid multi-gigabyte target/ folders on Windows/MSVC
[profile.dev]
debug = 0
strip = "debuginfo"
incremental = false

[profile.test]
debug = 0
strip = "debuginfo"
incremental = false

[profile.dev.package."*"]
debug = 0
opt-level = 0

[profile.release]
debug = 0
strip = "debuginfo"
lto = "thin"
codegen-units = 1
